<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAGUYA — Digital Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--navy:#030B24;--royal:#075BFF;--electric:#1677FF;--gold:#E8C49B;--white:#fff;
--serif:'Cormorant Garamond','Times New Roman',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--white);font-family:var(--sans)}
body{min-height:100%;background:radial-gradient(ellipse at 30% 20%,#06235e55,transparent 55%),radial-gradient(ellipse at 80% 90%,#075bff22,transparent 50%),linear-gradient(#020617,#030B24 60%,#020617)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.stage{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.panel-open .stage{transform:translateX(-12vw)}
.scene{width:min(88vw,640px);perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.shadow{position:relative;height:0}
.shadow::after{content:"";position:absolute;left:8%;right:8%;top:24px;height:34px;background:radial-gradient(ellipse,#075BFF66,transparent 70%);filter:blur(12px)}
.card{position:relative;width:100%;aspect-ratio:1.6;transform-style:preserve-3d;cursor:grab;container-type:inline-size;will-change:transform}
.card.drag{cursor:grabbing}
.face{position:absolute;inset:0;border-radius:4.2cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
background:radial-gradient(ellipse at 20% 30%,#0a2a7a 0%,#030B24 55%,#020617 100%);
border:1px solid #1677FF99;box-shadow:0 0 0 1px #075BFF33,0 0 5cqw #075BFF66,inset 0 0 6cqw #075BFF33}
.face.back{transform:rotateY(180deg)}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),#ffffff30,transparent 45%);mix-blend-mode:screen;z-index:5}
.face::before{content:"";position:absolute;inset:2.2cqw;border:1px solid #E8C49B55;border-radius:2.8cqw;pointer-events:none;z-index:4}
.art{position:absolute;inset:0;width:100%;height:100%}
/* front */
.logo{position:absolute;right:0;top:0;bottom:0;width:52%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;padding-bottom:5cqw}
.gold{background:linear-gradient(160deg,#fff4e0 0%,#E8C49B 40%,#b98a57 70%,#f3dcbc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.K{font-family:var(--serif);font-weight:600;font-size:30cqw;line-height:.85;filter:drop-shadow(0 0 2cqw #e8c49b55)}
.name{font-family:var(--serif);font-weight:600;font-size:7.6cqw;letter-spacing:1.6cqw;margin:1.2cqw 0 0 1.6cqw}
.rule{display:flex;align-items:center;gap:1.4cqw;margin-top:2cqw;width:60%}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#E8C49B)}
.rule i:last-child{transform:scaleX(-1)}
.rule svg{width:2.6cqw;height:2.6cqw;fill:#E8C49B}
.tag{position:absolute;bottom:5.6cqw;right:0;width:52%;text-align:center;font-size:1.9cqw;letter-spacing:.9cqw;color:#E8C49B;padding-left:.9cqw}
/* back */
.bhead{position:absolute;top:7cqw;left:0;right:0;text-align:center;z-index:3}
.bhead h1{margin:0;font-family:var(--serif);font-weight:600;font-size:8cqw;letter-spacing:1.6cqw;padding-left:1.6cqw}
.bhead p{margin:1cqw 0 0;font-family:var(--serif);font-size:3.2cqw;letter-spacing:.35cqw;color:#E8C49B}
.grid{position:absolute;left:8cqw;right:8cqw;bottom:7cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;z-index:6}
.cbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:2cqw;height:13.5cqw;padding:0 2.4cqw 0 2.6cqw;border-radius:2.6cqw;cursor:pointer;color:#E8C49B;
background:linear-gradient(135deg,#075bff22,#03082455);border:1px solid #1677FFcc;box-shadow:0 0 2.2cqw #1677FF55,inset 0 0 2cqw #075BFF33;
transition:transform .25s,box-shadow .3s,border-color .3s,color .3s;-webkit-tap-highlight-color:transparent}
.cbtn svg{width:6cqw;height:6cqw;flex:none}
.cbtn span{flex:1;font-size:3.5cqw;letter-spacing:.25cqw;font-weight:500}
.cbtn .arr{width:3cqw;height:3cqw;flex:none;opacity:.8;transition:transform .25s}
.cbtn:hover{border-color:#E8C49B;box-shadow:0 0 3.6cqw #E8C49Baa,inset 0 0 2cqw #E8C49B33;color:#fff3dd;transform:translateY(-.3cqw)}
.cbtn:hover .arr{transform:translateX(.8cqw)}
.cbtn:active{transform:scale(.95)}
.cbtn:focus-visible,.ctl:focus-visible,.pbtn:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ctrls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ctl{all:unset;cursor:pointer;padding:12px 22px;border-radius:999px;border:1px solid #1677FF99;color:#E8C49B;font-size:13px;letter-spacing:2px;background:#03082499;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.25s;min-height:44px;display:flex;align-items:center}
.ctl:hover{border-color:#E8C49B;box-shadow:0 0 18px #E8C49B66}
.ctl:active{transform:scale(.95)}
.hint{font-size:12px;color:#8fa6d6;letter-spacing:.5px;text-align:center;margin-top:-10px}
/* panel */
.panel{position:fixed;z-index:20;top:50%;right:4vw;width:min(360px,92vw);transform:translate(40px,-50%);opacity:0;visibility:hidden;pointer-events:none;
transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s .55s;
background:linear-gradient(160deg,#07184aee,#030B24f2);border:1px solid #1677FFaa;border-radius:22px;padding:28px 24px 24px;
box-shadow:0 0 40px #075BFF55,inset 0 0 30px #075BFF22;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;max-height:90dvh;overflow-y:auto}
.panel.show{transform:translate(0,-50%);opacity:1;visibility:visible;pointer-events:auto;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s}
.x{all:unset;position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#E8C49B;border:1px solid #E8C49B55;font-size:18px;transition:.25s}
.x:hover{background:#E8C49B22;transform:rotate(90deg)}
.bigic{width:76px;height:76px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;border:1px solid #E8C49B88;box-shadow:0 0 28px #1677FF77;color:#E8C49B}
.bigic svg{width:38px;height:38px}
.panel h2{margin:0;font-family:var(--serif);font-size:30px;letter-spacing:3px;font-weight:600}
.panel .sub{margin:6px 0 18px;font-size:14px;color:#a9bde8}
.info{padding:14px;border-radius:14px;border:1px solid #1677FF77;background:#02061799;margin-bottom:16px;word-break:break-all}
.info small{display:block;font-size:11px;letter-spacing:2px;color:#8fa6d6;margin-bottom:4px}
.info b{font-weight:500;font-size:17px;color:#E8C49B}
.prow{display:flex;gap:10px}
.pbtn{all:unset;box-sizing:border-box;flex:1;min-height:46px;display:grid;place-items:center;cursor:pointer;border-radius:12px;font-size:12px;letter-spacing:1.5px;text-align:center;padding:0 8px;transition:.25s}
.pbtn.c{border:1px solid #E8C49B88;color:#E8C49B}
.pbtn.c:hover{background:#E8C49B22;box-shadow:0 0 18px #E8C49B55}
.pbtn.o{background:linear-gradient(135deg,#075BFF,#1677FF);color:#fff;box-shadow:0 0 20px #075BFF88}
.pbtn.o:hover{box-shadow:0 0 28px #1677FFcc;transform:translateY(-1px)}
.pbtn:active{transform:scale(.96)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;background:#E8C49B;color:#020617;padding:10px 20px;border-radius:999px;font-size:13px;letter-spacing:1px;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
 .panel-open .stage{transform:translateY(-14vh) scale(.86)}
 .panel{top:auto;bottom:0;right:0;left:0;width:100%;border-radius:22px 22px 0 0;transform:translateY(100%);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
 .panel.show{transform:translateY(0)}
}
@media (max-width:560px){.card{aspect-ratio:1.38}.scene{width:92vw}.bhead{top:6cqw}.grid{bottom:6cqw}.cbtn{height:15cqw}.cbtn span{font-size:4cqw}.cbtn svg{width:6.6cqw;height:6.6cqw}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main class="stage" id="stage">
 <div class="scene" id="scene">
  <div class="card" id="card">
   <section class="face front" aria-label="Front side">
    <svg class="art" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
     <defs><linearGradient id="wv" x1="0" x2="1"><stop offset="0" stop-color="#075BFF" stop-opacity=".1"/><stop offset=".5" stop-color="#1677FF"/><stop offset="1" stop-color="#075BFF" stop-opacity="0"/></linearGradient></defs>
     <g fill="none" stroke="url(#wv)" stroke-width="1.1" opacity=".85">
      <path d="M-10 250 C80 170 150 330 250 240 S330 200 340 210"/><path d="M-10 270 C90 190 160 350 260 260 S330 225 345 235"/>
      <path d="M-10 290 C100 210 170 370 270 280 S335 250 350 262"/><path d="M-10 310 C110 230 180 390 280 300 S340 275 355 288"/>
      <path d="M-10 210 C70 130 140 280 230 200 S300 160 320 170" opacity=".6"/><path d="M-10 330 C120 250 190 410 290 320 S345 300 360 314" opacity=".5"/>
     </g>
     <g stroke="#E8C49B" stroke-width=".8" fill="#E8C49B" opacity=".9">
      <polyline fill="none" points="40,60 90,95 135,70 175,120 120,150"/><circle cx="40" cy="60" r="2.4"/><circle cx="90" cy="95" r="2"/><circle cx="135" cy="70" r="2.6"/><circle cx="175" cy="120" r="2"/><circle cx="120" cy="150" r="2.2"/>
      <polyline fill="none" points="215,40 250,75 290,55"/><circle cx="215" cy="40" r="1.8"/><circle cx="250" cy="75" r="2.2"/><circle cx="290" cy="55" r="1.8"/>
     </g>
     <g fill="#fff"><circle cx="60" cy="180" r="1"/><circle cx="200" cy="170" r="1.2"/><circle cx="25" cy="120" r="1"/><circle cx="300" cy="120" r="1"/><circle cx="170" cy="30" r="1"/><circle cx="100" cy="220" r="1.2"/><circle cx="270" cy="150" r=".9"/></g>
    </svg>
    <div class="logo"><div class="K gold">K</div><div class="name gold">KAGUYA</div>
     <div class="rule"><i></i><svg viewBox="0 0 24 24"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg><i></i></div></div>
    <div class="tag">DIGITAL EXPERIENCE</div>
    <div class="glare"></div>
   </section>
   <section class="face back" aria-label="Back side">
    <svg class="art" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
     <g fill="none" stroke="url(#wv)" stroke-width="1" opacity=".5"><path d="M-10 120 C150 40 250 200 400 110 S600 60 650 100"/><path d="M-10 140 C150 60 250 220 400 130 S600 80 650 120"/></g>
     <g fill="#fff"><circle cx="40" cy="50" r="1"/><circle cx="600" cy="40" r="1.2"/><circle cx="560" cy="350" r="1"/><circle cx="70" cy="340" r="1"/><circle cx="320" cy="20" r=".9"/></g>
    </svg>
    <div class="bhead"><h1 class="gold">KAGUYA</h1><p>Digital Creator &amp; Developer</p></div>
    <div class="grid" id="grid"></div>
    <div class="glare"></div>
   </section>
  </div>
  <div class="shadow"></div>
 </div>
 <div class="ctrls"><button class="ctl" id="flip">FLIP CARD ↻</button><button class="ctl" id="reset">RESET VIEW</button></div>
 <div class="hint">Drag the card to rotate it</div>
</main>

<aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="pt" aria-hidden="true">
 <button class="x" id="close" aria-label="Close panel">✕</button>
 <div class="bigic" id="pic"></div>
 <h2 class="gold" id="pt"></h2><p class="sub" id="ps"></p>
 <div class="info"><small id="pl"></small><b id="pv"></b></div>
 <div class="prow"><button class="pbtn c" id="pcopy"></button><a class="pbtn o" id="popen" target="_blank" rel="noopener noreferrer"></a></div>
</aside>
<div class="toast" id="toast" role="status">Copied</div>

<script>
const IC={
wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-4.6A8.7 8.7 0 1 1 8 19.6z"/><path d="M9 8.6c.2 2.9 2.6 5.7 6 6.4l1.2-1.4-2-1-.9.8c-1-.4-1.9-1.3-2.3-2.3l.8-.9-1-2z" fill="currentColor" stroke="none"/></svg>',
gm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6.5L21 7"/></svg>',
tg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M21.5 3.5L2.8 10.8l5.6 2.1 2 6.4 3.2-3.8 4.8 3.6z"/><path d="M8.4 12.9l10-6.6-7.9 8.8" /></svg>',
ch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h3l8 4.5V4.5L7 9H4a1 1 0 0 0-1 1z"/><path d="M19 9.5a4 4 0 0 1 0 5"/><path d="M7 15l1.2 5h2.3L9.600 16.500"/></svg>',
ar:'<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'};
const D={
wa:{n:'WhatsApp',t:'CONNECT WITH ME',s:'Let’s talk on WhatsApp.',l:'PHONE NUMBER',v:'+996 700 214 091',c:'COPY NUMBER',o:'OPEN WHATSAPP',h:'https://wa.me/996700214091'},
gm:{n:'Gmail',t:'EMAIL CONTACT',s:'Feel free to send me an email.',l:'EMAIL',v:'a1dana.bakdiraeva@gmail.com',c:'COPY EMAIL',o:'SEND EMAIL',h:'mailto:a1dana.bakdiraeva@gmail.com'},
tg:{n:'Telegram',t:'TELEGRAM PROFILE',s:'Let’s connect on Telegram.',l:'USERNAME',v:'@kaguya2_0_',c:'COPY USERNAME',o:'OPEN TELEGRAM',h:'https://t.me/kaguya2_0_'},
ch:{n:'Channel',t:'OFFICIAL CHANNEL',s:'Welcome to the KAGUYA community.',l:'KAGUYA CHANNEL',v:'https://t.me/kaguya_2_0_bots',c:'COPY LINK',o:'JOIN CHANNEL',h:'https://t.me/kaguya_2_0_bots'}};
const $=id=>document.getElementById(id);
const grid=$('grid');
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.className='cbtn';b.dataset.k=k;b.innerHTML=IC[k]+'<span>'+D[k].n+'</span>'+IC.ar;grid.appendChild(b)});

/* panel */
let cur=null,last=null;
const panel=$('panel');
function openP(k){const d=D[k];cur=k;
 $('pic').innerHTML=IC[k];$('pt').textContent=d.t;$('ps').textContent=d.s;$('pl').textContent=d.l;$('pv').textContent=d.v;
 $('pcopy').textContent=d.c;$('popen').textContent=d.o;$('popen').href=d.h;
 panel.classList.add('show');panel.setAttribute('aria-hidden','false');document.body.classList.add('panel-open');$('close').focus({preventScroll:true})}
function closeP(){cur=null;panel.classList.remove('show');panel.setAttribute('aria-hidden','true');document.body.classList.remove('panel-open');if(last)last.focus({preventScroll:true})}
grid.addEventListener('click',e=>{const b=e.target.closest('.cbtn');if(!b)return;last=b;cur===b.dataset.k?closeP():openP(b.dataset.k)});
$('close').onclick=closeP;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeP()});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)}
$('pcopy').onclick=async()=>{const v=D[cur].v;let ok=false;
 try{await navigator.clipboard.writeText(v);ok=true}catch(_){
  const a=document.createElement('textarea');a.value=v;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(_){}a.remove()}
 toast(ok?'Copied to clipboard':'Copy failed — select the text manually')};

/* 3D card */
const card=$('card'),scene=$('scene');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let base=0,rx=0,ry=0,tx=0,drag=null,hx=0,hy=0,dragY=0,dragX=0;
function frame(){
 const targetY=base+dragY+hx, targetX=dragX+hy;
 const k=RM?1:.12; ry+=(targetY-ry)*k; rx+=(targetX-rx)*k;
 card.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function glare(e){const r=card.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 // glare tracks pointer; mirrored on the back face because of its 180deg rotation
 card.querySelectorAll('.face').forEach(f=>{const back=f.classList.contains('back');f.style.setProperty('--gx',((back?1-px:px)*100)+'%');f.style.setProperty('--gy',(py*100)+'%')})}
scene.addEventListener('pointermove',e=>{
 if(drag){dragY=(e.clientX-drag.x)*.45;dragX=Math.max(-35,Math.min(35,-(e.clientY-drag.y)*.25))}
 else if(e.pointerType==='mouse'){const r=scene.getBoundingClientRect();hx=((e.clientX-r.left)/r.width-.5)*14;hy=-((e.clientY-r.top)/r.height-.5)*10}
 glare(e)});
scene.addEventListener('pointerleave',()=>{if(!drag){hx=0;hy=0}});
scene.addEventListener('pointerdown',e=>{if(e.target.closest('.cbtn'))return;drag={x:e.clientX,y:e.clientY};card.classList.add('drag');hx=0;hy=0;try{scene.setPointerCapture(e.pointerId)}catch(_){}});
function end(){if(!drag)return;drag=null;card.classList.remove('drag');
 const total=base+dragY;base=Math.round(total/180)*180;dragY=0;dragX=0}
scene.addEventListener('pointerup',end);scene.addEventListener('pointercancel',end);
$('flip').onclick=()=>{base+=180};
$('reset').onclick=()=>{base=Math.round(base/360)*360;dragY=dragX=hx=hy=0;if(cur)closeP()};

/* background */
const cv=$('bg'),cx=cv.getContext('2d');let W,H,st=[],pt=[];
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
 st=Array.from({length:Math.round(W*H/5500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,s:Math.random()*.15+.03,a:Math.random()}));
 pt=Array.from({length:26},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+1,vy:-(Math.random()*.2+.05),vx:(Math.random()-.5)*.1,g:Math.random()<.4}))}
size();addEventListener('resize',size);
function bgf(t){cx.clearRect(0,0,W,H);
 [[.2,.25,.4,'#075BFF18'],[.85,.8,.45,'#1677FF14']].forEach(o=>{const g=cx.createRadialGradient(W*o[0],H*o[1],0,W*o[0],H*o[1],Math.max(W,H)*o[2]);g.addColorStop(0,o[3]);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H)});
 st.forEach(s=>{if(!RM){s.x-=s.s;if(s.x<0)s.x=W}cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/1800+s.a*6));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()});
 pt.forEach(p=>{if(!RM){p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}}cx.globalAlpha=.22;cx.fillStyle=p.g?'#E8C49B':'#4d97ff';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()});
 cx.globalAlpha=1;if(!RM)requestAnimationFrame(bgf)}
requestAnimationFrame(bgf);
</script>
</body>
</html>

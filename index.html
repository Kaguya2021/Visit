<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <meta name="description" content="KAGUYA — Developer & Creator. Contact card.">
  <title>KAGUYA — Developer & Creator</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e9c878;
      --gold-bright: #fff0b6;
      --blue: #42a5ff;
      --white: #f4f7ff;
      --muted: #9ba9c4;
      --panel: rgba(10, 20, 43, .78);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(17, 62, 122, .28), transparent 48%),
        radial-gradient(ellipse at 15% 15%, rgba(19, 65, 130, .18), transparent 35%),
        linear-gradient(145deg, #030711 0%, #071329 48%, #02050d 100%);
    }
    .scene {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      perspective: 1000px;
    }
    .scene::before, .scene::after {
      content: ""; position: absolute; width: 75vw; height: 75vw; max-width: 900px; max-height: 900px;
      border: 1px solid rgba(59, 153, 255, .12); border-radius: 50%;
      left: 50%; top: 50%; transform: translate(-50%, -50%) rotateX(72deg);
      box-shadow: 0 0 70px rgba(29, 123, 255, .08), inset 0 0 70px rgba(29, 123, 255, .05);
      animation: wave 13s ease-in-out infinite alternate;
    }
    .scene::after {
      width: 105vw; height: 105vw; border-color: rgba(73, 155, 255, .07);
      animation-duration: 19s; animation-direction: alternate-reverse;
    }
    @keyframes wave {
      from { transform: translate(-50%, -50%) rotateX(72deg) scale(.92); opacity: .45; }
      to { transform: translate(-50%, -50%) rotateX(72deg) scale(1.08); opacity: 1; }
    }
    #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
    .glow {
      position: absolute; width: 420px; height: 420px; border-radius: 50%;
      background: rgba(0, 112, 255, .12); filter: blur(100px);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .card-wrap {
      width: min(100%, 390px);
      perspective: 1200px;
      z-index: 1;
    }
    .card {
      --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%;
      position: relative;
      width: 100%;
      min-height: 570px;
      padding: 42px 34px 27px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(233, 200, 120, .48);
      border-radius: 28px;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(145deg, rgba(18, 37, 72, .92), rgba(5, 12, 28, .96) 58%, rgba(8, 23, 47, .94));
      box-shadow: 0 35px 90px rgba(0, 0, 0, .55), 0 0 55px rgba(31, 122, 235, .13),
        inset 0 1px 0 rgba(255,255,255,.09);
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transform-style: preserve-3d;
      transition: transform .18s ease-out, box-shadow .35s ease;
      will-change: transform;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at var(--mx) var(--my), rgba(92, 174, 255, .19), transparent 38%);
    }
    .card::after {
      content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,.055);
      border-radius: 20px; pointer-events: none;
    }
    .top-line {
      position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 14px rgba(233, 200, 120, .55);
    }
    .brand { display: flex; flex-direction: column; align-items: center; transform: translateZ(38px); }
    .monogram {
      width: 112px; height: 112px; display: grid; place-items: center; position: relative;
      margin-bottom: 19px;
    }
    .monogram::before, .monogram::after {
      content: ""; position: absolute; inset: 8px; border: 1px solid rgba(233, 200, 120, .7);
      border-radius: 50%; transform: rotate(-28deg) scaleX(1.28);
      box-shadow: 0 0 18px rgba(233, 200, 120, .14);
    }
    .monogram::after {
      inset: 1px 14px; transform: rotate(55deg) scaleX(1.15);
      border-color: rgba(67, 160, 255, .55);
    }
    .monogram span {
      font-family: Georgia, "Times New Roman", serif; font-size: 72px; line-height: 1;
      font-weight: 400; color: transparent;
      background: linear-gradient(135deg, #fff4c9 12%, #d5a94e 48%, #fff0b6 75%, #a87928);
      background-clip: text; -webkit-background-clip: text;
      filter: drop-shadow(0 0 12px rgba(233, 200, 120, .3));
    }
    h1 {
      margin: 0; font-family: Georgia, "Times New Roman", serif;
      font-size: 34px; font-weight: 500; letter-spacing: .22em; padding-left: .22em;
      color: var(--gold-bright); text-shadow: 0 0 20px rgba(233, 200, 120, .22);
    }
    .subtitle {
      margin: 9px 0 0; color: #aebbd2; font-size: 11px; letter-spacing: .28em;
      text-transform: uppercase;
    }
    .separator {
      width: 100%; display: flex; align-items: center; gap: 12px; margin: 34px 0 23px;
      color: var(--gold); opacity: .75;
    }
    .separator::before, .separator::after {
      content: ""; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, rgba(233,200,120,.6));
    }
    .separator::after { transform: scaleX(-1); }
    .separator span { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; }
    .links { width: 100%; display: grid; gap: 12px; transform: translateZ(25px); }
    .contact {
      min-height: 52px; display: flex; align-items: center; gap: 14px;
      padding: 0 17px; border: 1px solid rgba(126, 164, 218, .2); border-radius: 13px;
      background: linear-gradient(100deg, rgba(17, 38, 72, .76), rgba(10, 22, 44, .58));
      color: #eaf2ff; text-decoration: none; font-size: 13px; letter-spacing: .045em;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .contact:hover, .contact:focus-visible {
      outline: none; transform: translateY(-3px) translateZ(8px);
      border-color: rgba(75, 170, 255, .85);
      background: linear-gradient(100deg, rgba(21, 57, 103, .92), rgba(10, 29, 57, .8));
      box-shadow: 0 8px 26px rgba(0, 119, 255, .17), inset 0 0 18px rgba(49, 145, 255, .07);
    }
    .contact svg { width: 19px; height: 19px; flex: 0 0 19px; color: var(--gold); }
    .contact .arrow { margin-left: auto; color: #7d9abd; font-size: 17px; }
    footer {
      width: 100%; margin-top: auto; padding-top: 25px; text-align: center;
      color: #8392ac; font-size: 9px; letter-spacing: .25em;
    }
    footer::before {
      content: ""; display: block; height: 1px; width: 100%; margin-bottom: 18px;
      background: linear-gradient(90deg, transparent, rgba(233,200,120,.55), transparent);
    }
    .hint {
      position: fixed; bottom: 18px; left: 0; right: 0; z-index: 2; text-align: center;
      color: rgba(169, 190, 220, .48); font-size: 10px; letter-spacing: .16em;
      text-transform: uppercase; pointer-events: none;
    }
    @media (max-width: 480px) {
      body { padding: 18px; }
      .card { min-height: 548px; padding: 35px 25px 24px; }
      .monogram { width: 100px; height: 100px; }
      .monogram span { font-size: 64px; }
      h1 { font-size: 30px; }
      .separator { margin: 29px 0 20px; }
      .contact { min-height: 50px; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="glow"></div>
    <canvas id="stars"></canvas>
  </div>

  <main class="card-wrap">
    <section class="card" id="card" aria-label="KAGUYA contact card">
      <div class="top-line"></div>
      <div class="brand">
        <div class="monogram" aria-hidden="true"><span>K</span></div>
        <h1>KAGUYA</h1>
        <p class="subtitle">Developer &amp; Creator</p>
      </div>

      <div class="separator"><span>Get in touch</span></div>

      <nav class="links" aria-label="Contact links">
        <a class="contact" href="https://wa.me/996700214091" target="_blank" rel="noopener noreferrer">

          <span>WhatsApp</span><span class="arrow">↗</span>
        </a>
        <a class="contact" href="mailto:a1dana.bakdiraeva@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-7.2 18-3.9-8.1L2 9.2 21 3Z"/><path d="M9.9 12.9 21 3"/></svg>

        <a class="contact" href="https://t.me/kaguya_2_0_bots" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m7 12 3.2 3.2L17.5 8"/></svg>

      </nav>

      <footer>© 2026 KAGUYA</footer>
    </section>
  </main>
  <div class="hint" aria-hidden="true">Move your cursor to explore</div>

  <script>
    (() => {
      const card = document.getElementById('card');
      const wrap = document.querySelector('.card-wrap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let frame = 0;

      function setTilt(x, y, rect) {
        const px = (x - rect.left) / rect.width;
        const py = (y - rect.top) / rect.height;
        const rotateY = (px - 0.5) * 18;
        const rotateX = (0.5 - py) * 18;
        card.style.setProperty('--rx', rotateX.toFixed(2) + 'deg');
        card.style.setProperty('--ry', rotateY.toFixed(2) + 'deg');
        card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        card.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      }
      function resetTilt() {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      }

      if (!reduceMotion) {
        wrap.addEventListener('pointermove', (event) => {
          if (event.pointerType === 'touch') return;
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(() => setTilt(event.clientX, event.clientY, card.getBoundingClientRect()));
        });
        wrap.addEventListener('pointerleave', resetTilt);

        // Touch drag gives mobile users a direct tilt interaction.
        let touchActive = false;
        wrap.addEventListener('touchstart', () => { touchActive = true; }, { passive: true });
        wrap.addEventListener('touchmove', (event) => {
          if (!touchActive || !event.touches.length) return;
          const t = event.touches[0];
          setTilt(t.clientX, t.clientY, card.getBoundingClientRect());
        }, { passive: true });
        wrap.addEventListener('touchend', () => { touchActive = false; resetTilt(); }, { passive: true });

        // Device orientation is used only when the browser grants permission.
        const enableOrientation = () => {
          if (!('DeviceOrientationEvent' in window)) return;
          const handle = (event) => {
            if (event.beta == null || event.gamma == null) return;
            const rx = Math.max(-10, Math.min(10, (event.beta - 45) * .22));
            const ry = Math.max(-10, Math.min(10, event.gamma * .22));
            card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
            card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
          };
          window.addEventListener('deviceorientation', handle, { passive: true });
        };
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          // iOS requires a user gesture; tilt interaction remains available by touch.
          document.addEventListener('click', function askOrientation() {
            DeviceOrientationEvent.requestPermission().then(result => {
              if (result === 'granted') enableOrientation();
            }).catch(() => {});
            document.removeEventListener('click', askOrientation);
          }, { once: true });
        } else {
          enableOrientation();
        }
      }

      // Small ambient star field, drawn locally with canvas (no external assets).
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({ length: Math.min(100, Math.floor(innerWidth * innerHeight / 11000)) }, () => ({
          x: Math.random() * innerWidth, y: Math.random() * innerHeight,
          r: Math.random() * 1.35 + .25, a: Math.random() * .55 + .12,
          speed: Math.random() * .18 + .035, phase: Math.random() * Math.PI * 2
        }));
      }
      let tick = 0;
      function draw() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        tick += .012;
        for (const s of stars) {
          const alpha = s.a * (.65 + .35 * Math.sin(tick * s.speed * 12 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(177, 211, 255, ${alpha})`;
          ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(draw);
      }
      resize();
      draw();
      window.addEventListener('resize', resize, { passive: true });
    })();
  </script>
</body>
</html>

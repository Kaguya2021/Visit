<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAGUYA — Premium Interactive 3D Business Card</title>
  
  <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020617;
      color: #ffffff;
      overflow-x: hidden;
      user-select: none;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Cosmic Galaxy Stars Canvas Background Styling */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* 3D Scene Properties */
    .perspective-container {
      perspective: 1200px;
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Custom Metallic Gold Gradients */
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF0D4 0%, #E8C49B 50%, #B88E55 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-border {
      border-image: linear-gradient(135deg, rgba(232,196,155,0.6), rgba(184,142,85,0.2)) 1;
    }

    /* Glassmorphic Panel Effects */
    .glass-card {
      background: linear-gradient(135deg, rgba(7, 27, 68, 0.75) 0%, rgba(3, 11, 36, 0.90) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(22, 119, 255, 0.25);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 30px 0 rgba(7, 91, 255, 0.25),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Custom Dynamic Glare Overlay */
    .card-glare {
      background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 50%), rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 65%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* Glowing Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; filter: blur(30px); }
      50% { opacity: 0.8; filter: blur(45px); }
    }

    .animate-pulse-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    /* Custom Scrollbar for Drawer */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(2, 6, 23, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(22, 119, 255, 0.4);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(232, 196, 155, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-[#020617]">

  <!-- Starfield Canvas -->
  <canvas id="space-canvas"></canvas>

  <!-- React Root Container -->
  <div id="root" class="relative z-10 w-full min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 md:p-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Contact Panel Data Configuration
    const CONTACT_DATA = {
      whatsapp: {
        id: 'whatsapp',
        title: 'CONNECT WITH ME',
        subtitle: "Let's talk on WhatsApp.",
        value: '+996 700 214 091',
        actionUrl: 'https://wa.me/996700214091',
        actionText: 'OPEN WHATSAPP',
        copyText: 'COPY NUMBER',
        brandColor: '#25D366',
        icon: (
          <svg className="w-8 h-8 text-[#25D366]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.572-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
        )
      },
      gmail: {
        id: 'gmail',
        title: 'EMAIL CONTACT',
        subtitle: 'Feel free to send me an email.',
        value: 'a1dana.bakdiraeva@gmail.com',
        actionUrl: 'mailto:a1dana.bakdiraeva@gmail.com',
        actionText: 'SEND EMAIL',
        copyText: 'COPY EMAIL',
        brandColor: '#EA4335',
        icon: (
          <svg className="w-8 h-8 text-[#EA4335]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L12 9.545l8.073-6.052C21.69 2.28 24 3.434 24 5.457z"/>
          </svg>
        )
      },
      telegram: {
        id: 'telegram',
        title: 'TELEGRAM PROFILE',
        subtitle: "Let's connect on Telegram.",
        value: '@kaguya2_0_',
        actionUrl: 'https://t.me/kaguya2_0_',
        actionText: 'OPEN TELEGRAM',
        copyText: 'COPY USERNAME',
        brandColor: '#26A5E4',
        icon: (
          <svg className="w-8 h-8 text-[#26A5E4]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        )
      },
      channel: {
        id: 'channel',
        title: 'OFFICIAL CHANNEL',
        subtitle: 'Welcome to the KAGUYA community.',
        value: 'KAGUYA CHANNEL',
        actionUrl: 'https://t.me/kaguya_2_0_bots',
        actionText: 'JOIN CHANNEL',
        copyText: 'COPY LINK',
        brandColor: '#E8C49B',
        icon: (
          <svg className="w-8 h-8 text-[#E8C49B]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        )
      }
    };

    function App() {
      const [isFlipped, setIsFlipped] = useState(false);
      const [rotation, setRotation] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [activePanel, setActivePanel] = useState(null);
      const [copied, setCopied] = useState(false);
      const [glarePos, setGlarePos] = useState({ x: 50, y: 50 });

      const cardRef = useRef(null);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const rotationStartRef = useRef({ x: 0, y: 0 });

      // Starfield Animation Canvas Effect
      useEffect(() => {
        const canvas = document.getElementById('space-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const stars = Array.from({ length: 140 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.015 + 0.005,
          color: Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#1677FF' : '#E8C49B')
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          stars.forEach(star => {
            star.alpha += star.speed;
            if (star.alpha > 1 || star.alpha < 0.1) star.speed = -star.speed;
            
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.globalAlpha = Math.abs(star.alpha);
            ctx.shadowBlur = star.radius > 1 ? 8 : 0;
            ctx.shadowColor = star.color;
            ctx.fill();
          });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      // Mouse Tilt & Pointer Controls
      const handlePointerDown = (e) => {
        if (e.target.closest('button') || e.target.closest('.no-drag')) return;
        setIsDragging(true);
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        dragStartRef.current = { x: clientX, y: clientY };
        rotationStartRef.current = { ...rotation };
      };

      const handlePointerMove = (e) => {
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);

        if (cardRef.current) {
          const rect = cardRef.current.getBoundingClientRect();
          const x = ((clientX - rect.left) / rect.width) * 100;
          const y = ((clientY - rect.top) / rect.height) * 100;
          setGlarePos({ x, y });
        }

        if (!isDragging) return;

        const deltaX = clientX - dragStartRef.current.x;
        const deltaY = clientY - dragStartRef.current.y;

        setRotation({
          x: Math.max(-40, Math.min(40, rotationStartRef.current.x - deltaY * 0.3)),
          y: Math.max(-60, Math.min(60, rotationStartRef.current.y + deltaX * 0.4))
        });
      };

      const handlePointerUp = () => {
        setIsDragging(false);
      };

      const handleResetView = () => {
        setIsFlipped(false);
        setRotation({ x: 0, y: 0 });
      };

      const handleCopy = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const totalYRotation = rotation.y + (isFlipped ? 180 : 0);

      return (
        <div 
          className="w-full min-h-screen flex flex-col justify-between items-center py-6 px-4 select-none overflow-hidden"
          onMouseMove={handlePointerMove}
          onTouchMove={handlePointerMove}
          onMouseUp={handlePointerUp}
          onTouchEnd={handlePointerUp}
        >
          <!-- Top Header Brand Identity -->
          <header className="text-center z-20 my-2">
            <h1 className="font-cinzel text-xl sm:text-2xl font-bold tracking-[0.3em] gold-gradient-text drop-shadow-[0_0_15px_rgba(232,196,155,0.3)]">
              KAGUYA
            </h1>
            <p className="text-[10px] sm:text-xs text-blue-300/60 uppercase tracking-[0.4em] mt-1 font-medium">
              Interactive 3D Experience
            </p>
          </header>

          <!-- Main Interactive 3D Canvas Stage -->
          <main className="perspective-container w-full max-w-[420px] h-[250px] sm:h-[280px] my-auto flex items-center justify-center relative cursor-grab active:cursor-grabbing">
            
            <!-- Cosmic Ambient Card Backdrop Glow -->
            <div className="absolute w-[300px] h-[180px] bg-gradient-to-tr from-[#075BFF]/30 to-[#E8C49B]/20 rounded-full blur-[50px] animate-pulse-glow pointer-events-none"></div>

            <!-- Flip Transform Card Wrapper -->
            <div
              ref={cardRef}
              onMouseDown={handlePointerDown}
              onTouchStart={handlePointerDown}
              className="w-full h-full relative preserve-3d transition-transform duration-500 cubic-bezier(0.15, 0.85, 0.35, 1.2)"
              style={{
                transform: `rotateX(${rotation.x}deg) rotateY(${totalYRotation}deg)`,
                transition: isDragging ? 'none' : 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)'
              }}
            >
              <!-- Dynamic Glare Light Reflection Effect -->
              <div 
                className="card-glare absolute inset-0 z-30 rounded-2xl pointer-events-none opacity-60"
                style={{
                  '--glare-x': `${glarePos.x}%`,
                  '--glare-y': `${glarePos.y}%`
                }}
              />

              <!-- CARD FRONT SIDE -->
              <div className="glass-card absolute inset-0 rounded-2xl p-6 sm:p-7 backface-hidden flex flex-col justify-between overflow-hidden border border-[#1677FF]/40 shadow-2xl">
                <!-- Decorative Gold Corner Trims -->
                <div className="absolute top-3 left-3 w-4 h-4 border-t-2 border-l-2 border-[#E8C49B]/60"></div>
                <div className="absolute top-3 right-3 w-4 h-4 border-t-2 border-r-2 border-[#E8C49B]/60"></div>
                <div className="absolute bottom-3 left-3 w-4 h-4 border-b-2 border-l-2 border-[#E8C49B]/60"></div>
                <div className="absolute bottom-3 right-3 w-4 h-4 border-b-2 border-r-2 border-[#E8C49B]/60"></div>

                <!-- Subtle Background Constellation Line Graphic -->
                <svg className="absolute top-0 right-0 w-64 h-64 opacity-20 pointer-events-none" viewBox="0 0 200 200">
                  <path d="M 10 10 L 80 50 L 150 30 L 180 120 L 110 170 Z" stroke="#E8C49B" strokeWidth="0.75" fill="none" strokeDasharray="3,3" />
                  <circle cx="10" cy="10" r="3" fill="#E8C49B" />
                  <circle cx="80" cy="50" r="2" fill="#1677FF" />
                  <circle cx="150" cy="30" r="3.5" fill="#E8C49B" />
                  <circle cx="180" cy="120" r="2" fill="#ffffff" />
                  <circle cx="110" cy="170" r="3" fill="#E8C49B" />
                </svg>

                <div className="flex justify-between items-start z-10">
                  <div className="text-[10px] tracking-[0.25em] text-[#E8C49B] font-mono">
                    EDITION // 2026
                  </div>
                  <div className="w-2 h-2 rounded-full bg-[#1677FF] shadow-[0_0_10px_#1677FF]"></div>
                </div>

                <!-- Center Brand Logo & Typography -->
                <div className="flex flex-col items-center justify-center my-auto z-10 text-center">
                  <!-- Monogram Icon -->
                  <div className="w-16 h-16 sm:w-18 sm:h-18 rounded-full border border-[#E8C49B]/40 bg-gradient-to-b from-[#075BFF]/20 to-transparent flex items-center justify-center mb-3 shadow-[0_0_20px_rgba(7,91,255,0.3)]">
                    <span className="font-cinzel text-3xl sm:text-4xl font-extrabold gold-gradient-text transform translate-y-[-1px]">
                      K
                    </span>
                  </div>
                  <h2 className="font-cinzel text-2xl sm:text-3xl font-bold tracking-[0.35em] gold-gradient-text">
                    KAGUYA
                  </h2>
                  <div className="w-24 h-[1px] bg-gradient-to-r from-transparent via-[#E8C49B]/70 to-transparent my-2"></div>
                </div>

                <!-- Bottom Footer Tagline -->
                <div className="flex justify-between items-end z-10 text-[9px] sm:text-[10px] text-blue-200/60 tracking-[0.25em] font-medium">
                  <span>OFFICIAL DIGITAL</span>
                  <span>EXPERIENCE</span>
                </div>
              </div>

              <!-- CARD BACK SIDE -->
              <div className="glass-card absolute inset-0 rounded-2xl p-5 sm:p-6 backface-hidden rotate-y-180 flex flex-col justify-between border border-[#1677FF]/40 shadow-2xl">
                <!-- Header Name & Title -->
                <div className="text-center z-10">
                  <h3 className="font-cinzel text-lg sm:text-xl font-bold tracking-[0.25em] gold-gradient-text">
                    KAGUYA
                  </h3>
                  <p className="text-[10px] sm:text-[11px] text-blue-300/70 tracking-widest font-medium mt-0.5">
                    Digital Creator & Developer
                  </p>
                </div>

                <!-- 2x2 Interactive Contact Buttons Grid -->
                <div className="grid grid-cols-2 gap-2.5 my-auto z-10 no-drag">
                  {Object.values(CONTACT_DATA).map((item) => (
                    <button
                      key={item.id}
                      onClick={(e) => {
                        e.stopPropagation();
                        setActivePanel(item);
                      }}
                      className="group relative flex items-center justify-between p-2.5 sm:p-3 rounded-xl bg-slate-900/60 border border-[#1677FF]/30 hover:border-[#E8C49B]/70 transition-all duration-300 hover:scale-[1.03] active:scale-[0.97] hover:shadow-[0_0_15px_rgba(7,91,255,0.4)] text-left overflow-hidden"
                    >
                      <div className="flex items-center space-x-2.5 z-10">
                        <div className="p-1.5 rounded-lg bg-slate-800/80 group-hover:bg-slate-700/80 transition-colors">
                          {item.icon}
                        </div>
                        <span className="text-xs font-semibold text-slate-200 group-hover:text-[#E8C49B] transition-colors">
                          {item.id === 'whatsapp' && 'WhatsApp'}
                          {item.id === 'gmail' && 'Gmail'}
                          {item.id === 'telegram' && 'Telegram'}
                          {item.id === 'channel' && 'Channel'}
                        </span>
                      </div>
                      <svg className="w-3.5 h-3.5 text-slate-500 group-hover:text-[#E8C49B] group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                      </svg>
                    </button>
                  ))}
                </div>

                <!-- Bottom Back Footer -->
                <div className="text-center z-10">
                  <span className="text-[9px] text-slate-400/60 uppercase tracking-[0.2em]">
                    Click options to expand
                  </span>
                </div>
              </div>

            </div>
          </main>

          <!-- 3D Scene Controls Bar -->
          <footer className="z-20 flex items-center space-x-3 my-4">
            <button
              onClick={() => setIsFlipped(!isFlipped)}
              className="px-5 py-2.5 rounded-full bg-slate-900/80 border border-[#1677FF]/40 hover:border-[#E8C49B] text-xs font-semibold text-slate-200 hover:text-[#E8C49B] shadow-lg transition-all duration-300 hover:shadow-[0_0_15px_rgba(7,91,255,0.4)] active:scale-95 flex items-center space-x-2 backdrop-blur-md"
            >
              <span>FLIP CARD</span>
              <span className="text-sm">↻</span>
            </button>

            <button
              onClick={handleResetView}
              className="px-5 py-2.5 rounded-full bg-slate-900/80 border border-slate-700 hover:border-slate-500 text-xs font-semibold text-slate-400 hover:text-white transition-all duration-300 active:scale-95 backdrop-blur-md"
            >
              RESET VIEW
            </button>
          </footer>

          <!-- Interactive Information Side/Bottom Modal Panel Drawer -->
          {activePanel && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-end p-0 sm:p-6 bg-black/60 backdrop-blur-sm transition-opacity duration-300 animate-fadeIn">
              <div 
                className="w-full sm:w-[380px] bg-[#030B24]/95 border-t sm:border border-[#1677FF]/40 rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl relative flex flex-col justify-between z-10 transform transition-transform duration-300 ease-out"
                onClick={(e) => e.stopPropagation()}
              >
                <!-- Close Button -->
                <button
                  onClick={() => setActivePanel(null)}
                  className="absolute top-4 right-4 p-2 rounded-full bg-slate-800/60 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors"
                >
                  ✕
                </button>

                <div>
                  <!-- Panel Header -->
                  <div className="flex items-center space-x-3 mb-4">
                    <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700">
                      {activePanel.icon}
                    </div>
                    <div>
                      <h4 className="font-cinzel text-base font-bold gold-gradient-text">
                        {activePanel.title}
                      </h4>
                      <p className="text-xs text-slate-400">
                        {activePanel.subtitle}
                      </p>
                    </div>
                  </div>

                  <!-- Information Card Box -->
                  <div className="p-4 rounded-xl bg-slate-950/80 border border-slate-800/80 my-4 text-center">
                    <span className="text-xs text-blue-300/60 block mb-1 font-mono uppercase tracking-wider">
                      Contact Information
                    </span>
                    <span className="text-base sm:text-lg font-bold text-slate-100 font-mono select-all break-all">
                      {activePanel.value}
                    </span>
                  </div>
                </div>

                <!-- Action Buttons -->
                <div className="grid grid-cols-2 gap-3 mt-4">
                  <button
                    onClick={() => handleCopy(activePanel.value)}
                    className="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 transition-colors flex items-center justify-center space-x-1.5"
                  >
                    <span>{copied ? 'COPIED!' : activePanel.copyText}</span>
                  </button>

                  <a
                    href={activePanel.actionUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="py-3 px-4 rounded-xl bg-gradient-to-r from-[#075BFF] to-[#1677FF] hover:from-[#1677FF] hover:to-[#075BFF] text-xs font-bold text-white text-center transition-all shadow-[0_0_15px_rgba(7,91,255,0.4)] flex items-center justify-center"
                  >
                    {activePanel.actionText}
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
